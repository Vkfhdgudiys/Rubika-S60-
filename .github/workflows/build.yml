name: Build Rubika S60

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant wget unzip

      - name: Download Java ME libraries
        run: |
          mkdir -p lib
          wget -O lib/cldcapi11.jar https://raw.githubusercontent.com/DanielSant0s/Athena2ME/main/lib/cldcapi11.jar
          wget -O lib/midp21.jar https://raw.githubusercontent.com/DanielSant0s/Athena2ME/main/lib/midp21.jar

      - name: Compile MIDlet
        run: |
          mkdir -p build/classes
          javac -source 7 -target 7 \
            -bootclasspath lib/cldcapi11.jar \
            -classpath lib/midp21.jar \
            -d build/classes src/RubikaS60.java
                - name: Package JAR
        run: |
          mkdir -p build
          cat > build/MANIFEST.MF <<'EOF'
          Manifest-Version: 1.0
          MIDlet-Name: Rubika S60
          MIDlet-Version: 0.1
          MIDlet-Vendor: Rubika S60 Project
          MIDlet-1: Rubika S60,,RubikaS60
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          EOF

          cd build/classes
          jar cfm ../RubikaS60.jar ../MANIFEST.MF .
          cd ../..

          cat > build/RubikaS60.jad <<'EOF'
          MIDlet-Name: Rubika S60
          MIDlet-Version: 0.1
          MIDlet-Vendor: Rubika S60 Project
          MIDlet-1: Rubika S60,,RubikaS60
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          MIDlet-Jar-URL: RubikaS60.jar
          EOF  
